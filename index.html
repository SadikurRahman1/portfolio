<style>
  :root{
    --ink:#0a0d12;
    --panel:#0f1319;
    --panel-2:#141a22;
    --border:#1e2530;
    --text:#e8eaed;
    --text-dim:#9aa4b2;
    --text-faint:#5c6675;
    --blue:#4c8dff;
    --teal:#2fd4c0;
    --amber:#f0b429;
    --radius-sm:6px;
    --radius-md:10px;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Manrope', -apple-system, sans-serif;
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --ink:#f7f8fa;
    --panel:#ffffff;
    --panel-2:#f1f3f6;
    --border:#e1e5eb;
    --text:#171b21;
    --text-dim:#565f6c;
    --text-faint:#8b93a1;
    color-scheme: light;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.6;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  ul{list-style:none;}
  button{font-family:inherit; cursor:pointer;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
  section{padding:104px 0; scroll-margin-top:72px;}
  @media (max-width:768px){ section{padding:72px 0;} }

  h1,h2,h3,h4{font-weight:700; letter-spacing:-0.02em; line-height:1.15;}
  .eyebrow{
    font-family:var(--mono);
    font-size:13px;
    color:var(--teal);
    display:flex; align-items:center; gap:10px;
    margin-bottom:14px;
  }
  .eyebrow::before{content:"";width:18px; height:1px; background:var(--teal); display:inline-block;}
  .sec-head{max-width:640px; margin-bottom:56px;}
  .sec-head h2{font-size:clamp(28px,3.4vw,40px); margin-bottom:14px;}
  .sec-head p{color:var(--text-dim); font-size:17px;}

  :focus-visible{outline:2px solid var(--blue); outline-offset:3px;}

  /* ---------- NAV ---------- */
  header{
    position:sticky; top:0; z-index:100;
    background:color-mix(in srgb, var(--ink) 82%, transparent);
    backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid var(--border);
  }
  .navbar{display:flex; align-items:center; justify-content:space-between; height:68px;}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--teal); box-shadow:0 0 12px var(--teal);}
  .brand code{font-family:var(--mono); color:var(--text-dim); font-size:13px; font-weight:400;}
  .navlinks{display:flex; align-items:center; gap:32px;}
  .navlinks a{
    font-size:14.5px; color:var(--text-dim); font-weight:500;
    position:relative; padding:4px 0; transition:color .15s;
  }
  .navlinks a:hover{color:var(--text);}
  .navlinks a::after{
    content:""; position:absolute; left:0; bottom:-3px; width:0; height:1px;
    background:var(--teal); transition:width .2s;
  }
  .navlinks a:hover::after{width:100%;}
  .nav-right{display:flex; align-items:center; gap:14px;}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 20px; border-radius:var(--radius-sm);
    font-size:14px; font-weight:600; border:1px solid transparent;
    transition:transform .15s, background .15s, border-color .15s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--blue); color:#fff;}
  .btn-primary:hover{background:#3d7cf0;}
  .btn-primary[disabled]{opacity:.6; cursor:progress;}
  .btn-outline{border-color:var(--border); color:var(--text);}
  .btn-outline:hover{border-color:var(--text-faint);}
  .theme-toggle{
    width:36px; height:36px; border-radius:50%;
    border:1px solid var(--border); background:var(--panel);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim);
  }
  .theme-toggle:hover{color:var(--text);}
  .theme-toggle svg{width:16px; height:16px;}
  .icon-moon{display:none;}
  :root[data-theme="light"] .icon-sun{display:none;}
  :root[data-theme="light"] .icon-moon{display:block;}

  .hamburger{display:none; width:36px; height:36px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--panel); align-items:center; justify-content:center;}
  .hamburger span, .hamburger span::before, .hamburger span::after{
    content:""; display:block; width:16px; height:1.5px; background:var(--text); position:relative; transition:.2s;
  }
  .hamburger span::before{position:absolute; top:-5px;}
  .hamburger span::after{position:absolute; top:5px;}

  .mobile-menu{
    display:none; flex-direction:column; gap:2px; padding:12px 24px 20px;
    border-bottom:1px solid var(--border); background:var(--ink);
  }
  .mobile-menu a{padding:12px 4px; font-size:15px; color:var(--text-dim); border-bottom:1px solid var(--border);}
  .mobile-menu a:last-child{border-bottom:none;}
  .mobile-menu.open{display:flex;}

  @media (max-width:860px){
    .navlinks, .nav-right .btn-primary{display:none;}
    .hamburger{display:flex;}
  }

  /* ---------- HERO ---------- */
  .hero{padding:88px 0 80px;}
  .hero-grid{display:grid; grid-template-columns:1.15fr 1fr; gap:60px; align-items:center;}
  @media (max-width:900px){ .hero-grid{grid-template-columns:1fr;} }
  .hero-kicker{
    font-family:var(--mono); font-size:13px; color:var(--text-faint);
    display:flex; align-items:center; gap:8px; margin-bottom:18px;
  }
  .pulse{width:7px; height:7px; border-radius:50%; background:var(--teal); animation:pulse 2s infinite; flex-shrink:0;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.3;}}
  .hero h1{font-size:clamp(34px,5vw,54px); margin-bottom:6px;}
  .hero .role{
    font-family:var(--mono); font-size:clamp(14px,1.6vw,16px);
    color:var(--blue); margin-bottom:22px; font-weight:500;
  }
  .hero p.intro{font-size:17px; color:var(--text-dim); max-width:480px; margin-bottom:34px;}
  .hero-ctas{display:flex; gap:14px; margin-bottom:40px; flex-wrap:wrap;}
  .socials{display:flex; gap:12px;}
  .social-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim);
    transition:.15s;
  }
  .social-btn:hover{color:var(--text); border-color:var(--text-faint); transform:translateY(-2px);}
  .social-btn svg{width:16px; height:16px;}

  /* ---------- CODE WINDOW ---------- */
  .code-window{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-md);
    overflow:hidden; box-shadow:0 30px 60px -20px rgba(0,0,0,.5);
  }
  .code-titlebar{
    display:flex; align-items:center; gap:8px; padding:12px 16px;
    border-bottom:1px solid var(--border); background:var(--panel-2);
  }
  .code-titlebar .dots{display:flex; gap:6px;}
  .code-titlebar .dots span{width:10px; height:10px; border-radius:50%;}
  .code-titlebar .dots span:nth-child(1){background:#ff5f56;}
  .code-titlebar .dots span:nth-child(2){background:#ffbd2e;}
  .code-titlebar .dots span:nth-child(3){background:#27c93f;}
  .code-titlebar .filename{font-family:var(--mono); font-size:12.5px; color:var(--text-faint); margin-left:6px;}
  .code-body{
    padding:20px 18px; font-family:var(--mono);
    font-size:13px; line-height:1.9; overflow-x:auto;
  }
  .code-line{display:flex; align-items:flex-start; white-space:pre;}
  .code-line .ln{
    flex:0 0 30px; text-align:right; padding-right:16px;
    color:var(--text-faint); user-select:none; font-variant-numeric:tabular-nums;
  }
  .code-line .src{flex:1 1 auto; white-space:pre;}
  .tok-kw{color:#c792ea;} .tok-type{color:var(--teal);} .tok-str{color:#c3e88d;}
  .tok-fn{color:var(--blue);} .tok-com{color:var(--text-faint); font-style:italic;} .tok-prop{color:#f78c6c;}
  :root[data-theme="light"] .tok-kw{color:#8b45c9;}
  :root[data-theme="light"] .tok-str{color:#3d8b40;}
  :root[data-theme="light"] .tok-prop{color:#c4501a;}

/* ---------- STATS ---------- */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; margin-top:48px; box-shadow:0 12px 30px rgba(0,0,0,.12);}
@media (max-width:700px){ .stats{grid-template-columns:repeat(2,1fr);} }
.stat{background:var(--panel); padding:26px 20px; transition:.25s ease;}
.stat:hover{background:var(--panel-2);}
.stat .num{font-family:var(--mono); font-size:26px; font-weight:700; color:var(--teal);}
.stat .lbl{font-size:13.5px; color:var(--text-dim); margin-top:6px;}

.about-grid{display:grid; grid-template-columns:1fr 1fr; gap:64px; align-items:start;}
@media (max-width:860px){ .about-grid{grid-template-columns:1fr; gap:40px;} }
.about-grid p{color:var(--text-dim); margin-bottom:16px; font-size:15.5px; line-height:1.8;}
.about-grid strong{color:var(--text); font-weight:600;}
.about-title{font-size:clamp(26px,3.2vw,36px); margin-bottom:18px; font-weight:700; letter-spacing:-.5px;}

  /* ---------- SKILLS ---------- */
  .skills-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:28px;}
  @media (max-width:900px){ .skills-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .skills-grid{grid-template-columns:1fr;} }
  .skill-cat{border:1px solid var(--border); border-radius:var(--radius-md); padding:24px 22px; background:var(--panel);}
  .skill-cat h4{font-size:14px; font-family:var(--mono); color:var(--text-faint); margin-bottom:16px; font-weight:500;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    font-size:13.5px; padding:6px 12px; border-radius:5px;
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
  }

  /* ---------- EXPERIENCE ---------- */
  .timeline{position:relative; padding-left:32px; border-left:1px solid var(--border);}
  .tl-item{position:relative; padding-bottom:44px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-item::before{
    content:""; position:absolute; left:-37px; top:4px; width:11px; height:11px;
    border-radius:50%; background:var(--ink); border:2px solid var(--blue);
  }
  .tl-item h3{font-size:19px; margin-bottom:2px;}
  .tl-item .org{color:var(--blue); font-size:14.5px; font-weight:600; margin-bottom:4px;}
  .tl-item .period{font-family:var(--mono); font-size:12.5px; color:var(--text-faint); margin-bottom:14px; display:block;}
  .tl-item ul{display:grid; gap:8px;}
  .tl-item li{color:var(--text-dim); font-size:14.5px; padding-left:18px; position:relative;}
  .tl-item li::before{content:"—"; position:absolute; left:0; color:var(--text-faint);}

  /* ---------- FEATURED PROJECT ---------- */
  .featured{
    border:1px solid var(--border); border-radius:14px; overflow:hidden;
    background:linear-gradient(160deg, var(--panel), var(--panel-2));
    position:relative;
  }
  .featured-inner{display:grid; grid-template-columns:1fr 1fr; gap:0;}
  @media (max-width:860px){ .featured-inner{grid-template-columns:1fr;} }
  .featured-visual{
    background:radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--blue) 18%, transparent), transparent 60%), var(--panel-2);
    padding:48px; display:flex; align-items:center; justify-content:center; border-right:1px solid var(--border);
    min-height:340px;
  }
  @media (max-width:860px){ .featured-visual{border-right:none; border-bottom:1px solid var(--border);} }
  .phone{width:190px; aspect-ratio:9/18.5; border-radius:26px; border:6px solid var(--panel-2); background:var(--ink); box-shadow:0 25px 50px -12px rgba(0,0,0,.6), 0 0 0 1px var(--border); position:relative; overflow:hidden;}
  .phone::before{content:""; position:absolute; top:0; left:50%; transform:translateX(-50%); width:60%; height:18px; background:var(--panel-2); border-radius:0 0 12px 12px;}
  .phone-bar{position:absolute; top:32px; left:14px; right:14px; height:8px; border-radius:4px; background:color-mix(in srgb, var(--blue) 40%, transparent);}
  .phone-bar2{top:48px; width:60%; background:color-mix(in srgb, var(--teal) 40%, transparent);}
  .phone-card{position:absolute; left:14px; right:14px; height:56px; border-radius:8px; background:var(--panel); border:1px solid var(--border);}
  .featured-content{padding:44px;}
  @media (max-width:600px){ .featured-content{padding:32px 24px;} }
  .featured-content h3{font-size:26px; margin-bottom:10px;}
  .featured-content .sub{font-family:var(--mono); font-size:13px; color:var(--teal); margin-bottom:16px;}
  .featured-content p{color:var(--text-dim); font-size:15px; margin-bottom:20px;}
  .feat-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px;}
  .feat-list span{font-size:12.5px; color:var(--text-dim); padding:5px 11px; border:1px solid var(--border); border-radius:20px;}
  .badges{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px;}
  .badge{font-family:var(--mono); font-size:12px; padding:5px 10px; border-radius:5px; background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim);}
  .downloads{font-family:var(--mono); font-size:13px; color:var(--amber); margin-bottom:22px; display:inline-block;}
  .feat-ctas{display:flex; gap:12px; flex-wrap:wrap;}

  /* ---------- PROJECT GRID ---------- */
  .proj-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:24px;}
  @media (max-width:900px){ .proj-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .proj-grid{grid-template-columns:1fr;} }
  .proj-card{border:1px solid var(--border); border-radius:var(--radius-md); background:var(--panel); overflow:hidden; display:flex; flex-direction:column;}
  .proj-thumb{
    height:140px; position:relative; overflow:hidden;
    background:var(--panel-2);
    display:flex; align-items:center; justify-content:center;
  }
  .proj-thumb svg{width:44px; height:44px; color:var(--text-faint); opacity:.6;}
  .proj-thumb img{width:100%; height:100%; object-fit:cover;}
  .proj-body{padding:20px 20px 22px; display:flex; flex-direction:column; flex:1;}
  .proj-body h4{font-size:16.5px; margin-bottom:8px;}
  .proj-body p{color:var(--text-dim); font-size:13.8px; margin-bottom:16px; flex:1;}
  .proj-tags{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
  .proj-tags span{font-family:var(--mono); font-size:11px; color:var(--text-faint); padding:3px 8px; border:1px solid var(--border); border-radius:4px;}
  .proj-links{display:flex; gap:10px;}
  .proj-links a{font-size:13px; font-weight:600; color:var(--blue);}
  .proj-toggle{display:flex; justify-content:center; margin-top:24px;}

  /* ---------- SERVICES ---------- */
  .services-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:24px;}
  @media (max-width:860px){ .services-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .services-grid{grid-template-columns:1fr;} }
  .svc-card{padding:26px 24px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--panel);}
  .svc-icon{width:36px; height:36px; color:var(--blue); margin-bottom:16px;}
  .svc-card h4{font-size:16px; margin-bottom:8px;}
  .svc-card p{color:var(--text-dim); font-size:14px;}

  /* ---------- APPROACH ---------- */
  .approach-list{
    display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:18px; margin-top:8px;
  }
  .ap-item{
    position:relative; display:grid; grid-template-columns:64px 1fr; gap:18px;
    align-items:center; padding:18px 18px 18px 14px; border:1px solid var(--border);
    border-radius:var(--radius-md); background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0));
    overflow:hidden;
  }
  .ap-item::before{
    content:""; position:absolute; inset:0 auto 0 0; width:3px;
    background:linear-gradient(180deg, var(--teal), var(--blue));
  }
  .ap-item .idx{
    width:42px; height:42px; display:flex; align-items:center; justify-content:center;
    border-radius:50%; border:1px solid color-mix(in srgb, var(--teal) 40%, var(--border));
    background:var(--panel-2); font-family:var(--mono); font-size:12px; color:var(--teal);
    margin-left:10px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
  }
  .ap-item h4{font-size:16px; font-weight:600; line-height:1.35;}
  @media (max-width:760px){ .approach-list{grid-template-columns:1fr;} }

  /* ---------- EDUCATION (center progress rail, alternating sides) ---------- */
  .edu-rail{position:relative; max-width:980px; margin:0 auto; padding:8px 0;}
  .edu-rail::before{
    content:""; position:absolute; left:50%; top:0; bottom:0;
    width:2px; margin-left:-1px; background:var(--border); border-radius:2px;
  }
  .edu-fill{
    position:absolute; left:50%; top:0; width:2px; margin-left:-1px; height:0;
    background:linear-gradient(to bottom, var(--teal), var(--blue));
    border-radius:2px; transition:height .45s ease-out;
    box-shadow:0 0 14px color-mix(in srgb, var(--blue) 55%, transparent);
  }
  .edu-row{
    position:relative; display:grid; grid-template-columns:1fr 72px 1fr;
    align-items:center; margin-bottom:34px;
  }
  .edu-row:last-child{margin-bottom:0;}
  /* both children share one grid row, otherwise auto-placement pushes the node down */
  .edu-card, .edu-node{grid-row:1;}
  .edu-node{
    grid-column:2; justify-self:center; z-index:2;
    width:38px; height:38px; border-radius:50%;
    background:var(--ink); border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:12px; color:var(--text-faint);
    transition:border-color .3s, color .3s, box-shadow .3s;
  }
  .edu-row.active .edu-node{
    border-color:var(--blue); color:var(--blue);
    box-shadow:0 0 0 5px color-mix(in srgb, var(--blue) 12%, transparent);
  }
  .edu-card{
    border:1px solid var(--border); border-radius:var(--radius-md);
    padding:20px 22px; background:var(--panel); position:relative;
    transition:border-color .3s, transform .3s;
  }
  .edu-row.active .edu-card{border-color:color-mix(in srgb, var(--blue) 45%, var(--border));}
  .edu-card h4{font-size:16px; margin-bottom:5px;}
  .edu-card .school{color:var(--text-dim); font-size:14px;}
  .edu-card .detail{color:var(--text-faint); font-size:13px; margin-top:3px;}
  .edu-card .when{
    display:inline-block; margin-top:12px; font-family:var(--mono);
    font-size:11.5px; color:var(--teal); padding:3px 9px; border-radius:20px;

  .edu-row.left .edu-card::after{right:-25px;}
  .edu-row.right .edu-card{grid-column:3; text-align:left;}
  .edu-row.right .edu-card::after{left:-25px;}

    .edu-row.left .edu-card,
    .edu-row.right .edu-card{grid-column:2; text-align:left;}
    .edu-card::after{display:none;}
  }

  .github-cta{
    border:1px solid var(--border); border-radius:14px; padding:56px 40px; text-align:center;
    background:radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--blue) 10%, transparent), transparent 60%), var(--panel);
  }
  .github-cta h3{font-size:clamp(22px,3vw,30px); margin-bottom:22px;}

  .info-row svg{width:17px; height:17px; color:var(--blue); flex-shrink:0;}
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:13px; color:var(--text-faint); margin-bottom:7px; font-family:var(--mono);}
  .field input, .field textarea{
    width:100%; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:12px 14px; color:var(--text); font-family:var(--sans); font-size:14.5px;
  }
  .field input:focus, .field textarea:focus{border-color:var(--blue); outline:none;}
  .field input.invalid, .field textarea.invalid{border-color:#ff6b6b;}
  .field textarea{resize:vertical; min-height:110px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:480px){ .row2{grid-template-columns:1fr;} }
  .form-status{
    margin-top:14px; font-size:14px; padding:12px 14px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--panel); display:none;

  .form-status.show{display:block;}
  .form-status.ok{border-color:color-mix(in srgb, var(--teal) 45%, var(--border)); color:var(--teal);}
  .form-status.err{border-color:#ff6b6b; color:#ff8787;}
  .form-status a{color:var(--blue); font-weight:600;}

  .footer-inner .copy{font-size:12.5px; color:var(--text-faint); margin-top:8px;}

    "\\b([a-z_][A-Za-z0-9_]*)(?=\\/)"                                      // 6 folder-ish token
  ].join("|"), "g");

  function highlightDart(line){
    var out = '', last = 0, m;
    DART_RE.lastIndex = 0;
    while((m = DART_RE.exec(line)) !== null){
      out += esc(line.slice(last, m.index));
      var cls = m[1] ? 'tok-com'
              : m[2] ? 'tok-str'
              : m[3] ? 'tok-kw'
              : m[4] ? 'tok-type'
              : m[5] ? 'tok-fn'
              : 'tok-prop';
      out += '<span class="' + cls + '">' + esc(m[0]) + '</span>';
      last = m.index + m[0].length;
    }
    out += esc(line.slice(last));
    return out;
  }

  function renderCode(containerId, lines){
    var el = $(containerId);
    if(!el || !lines || !lines.length) return;
    el.innerHTML = lines.map(function(line, i){
      return '<div class="code-line"><span class="ln">' + (i + 1) + '</span>' +
             '<span class="src">' + (line === '' ? '&nbsp;' : highlightDart(line)) + '</span></div>';
    }).join('');
  }

  /* ============================================================
     2. Section renderers
     ============================================================ */
  function renderNav(nav){
    if(!nav || !nav.length) return;
    var html = nav.map(function(n){
      return '<a href="' + esc(n.href) + '">' + esc(n.label) + '</a>';
    }).join('');
    if($('navlinks')) $('navlinks').innerHTML = html;
    if($('mobileMenu')) $('mobileMenu').innerHTML = html;
  }

  function renderSocials(profile){
    var order = ['github', 'linkedin', 'facebook', 'instagram'];
    var html = order.filter(function(k){ return profile[k]; }).map(function(k){
      return '<a class="social-btn" href="' + esc(profile[k]) + '" target="_blank" rel="noopener" aria-label="' +
             k.charAt(0).toUpperCase() + k.slice(1) + '">' +
             '<svg viewBox="0 0 24 24" fill="currentColor"><path d="' + SOCIAL_PATHS[k] + '"/></svg></a>';
    }).join('');
    document.querySelectorAll('[data-socials]').forEach(function(box){ box.innerHTML = html; });
  }

  function renderHero(hero, profile){
    setText('hero-kicker-text', hero.kicker);
    setText('hero-greeting', hero.greeting || ("Hi, I'm " + (profile.name || '')));
    setText('hero-role', profile.title);
    setText('hero-intro', hero.intro);
    setText('hero-code-file', hero.codeFile || 'developer.dart');
    renderCode('hero-code', hero.code);

    var ctas = [];
    if(hero.primaryButton){
      ctas.push('<a href="' + esc(hero.primaryButton.href || '#projects') + '" class="btn btn-primary">' + esc(hero.primaryButton.label) + '</a>');
    }
    if(hero.secondaryButton){
      ctas.push('<a href="' + esc(hero.secondaryButton.href || '#contact') + '" class="btn btn-outline">' + esc(hero.secondaryButton.label) + '</a>');
    }
    if(profile.cv){
      var cvLabel = (hero.cvButton && hero.cvButton.label) || 'Download CV';
      ctas.push('<a href="' + esc(profile.cv) + '" class="btn btn-outline" target="_blank" rel="noopener" download>' + esc(cvLabel) + '</a>');
    }
    if($('hero-ctas')) $('hero-ctas').innerHTML = ctas.join('');
  }

  function renderAbout(about){
    setText('about-label', about.label || 'About');
    setText('about-title', about.title);
    if($('about-paragraphs')){
      $('about-paragraphs').innerHTML = (about.paragraphs || []).map(function(p){
        return '<p>' + esc(p) + '</p>';
      }).join('');
    }
    setText('about-code-file', about.codeFile || 'architecture.dart');
    renderCode('about-code', about.code);
    if($('about-stats')){
      $('about-stats').innerHTML = (about.stats || []).map(function(s){
        return '<div class="stat"><div class="num">' + esc(s.number) + '</div><div class="lbl">' + esc(s.label) + '</div></div>';
      }).join('');
    }
  }

  function renderSkills(skills){
    setText('skills-label', skills.label || 'Skills');
    setText('skills-title', skills.title);
    setText('skills-desc', skills.description);
    if($('skills-grid')){
      $('skills-grid').innerHTML = (skills.categories || []).map(function(c){
        var chips = (c.items || []).map(function(i){ return '<span class="chip">' + esc(i) + '</span>'; }).join('');
        return '<div class="skill-cat"><h4>' + esc(c.category) + '</h4><div class="chip-row">' + chips + '</div></div>';

  function renderExperience(exp){
    setText('exp-label', exp.label || 'Experience');
    setText('exp-title', exp.title);
    if($('exp-timeline')){
      $('exp-timeline').innerHTML = (exp.items || []).map(function(job){
        var duties = (job.responsibilities || []).map(function(d){ return '<li>' + esc(d) + '</li>'; }).join('');
        return '<div class="tl-item">' +
          '<h3>' + esc(job.position) + '</h3>' +
          '<div class="org">' + esc(job.company) + '</div>' +
          '<span class="period">' + esc(job.period) + '</span>' +
          '<ul>' + duties + '</ul></div>';
      }).join('');

  function renderProjects(projects){
    setText('proj-label', projects.label || 'Featured Project');
    setText('proj-title', projects.title);
    setText('proj-other-title', projects.otherTitle || 'Other projects');
    setText('proj-other-desc', projects.otherDescription);

    var f = projects.featured;
    if(f && $('featured-project')){
      var features = (f.features || []).map(function(x){ return '<span>' + esc(x) + '</span>'; }).join('');
      var tech = (f.tech || []).map(function(x){ return '<span class="badge">' + esc(x) + '</span>'; }).join('');
      var ctas = '';
      if(f.playStore) ctas += '<a class="btn btn-primary" href="' + esc(f.playStore) + '" target="_blank" rel="noopener">Google Play</a>';
      if(f.appStore)  ctas += '<a class="btn btn-outline" href="' + esc(f.appStore) + '" target="_blank" rel="noopener">App Store</a>';
      if(f.link)      ctas += '<a class="btn btn-outline" href="' + esc(f.link) + '" target="_blank" rel="noopener">Visit</a>';

      $('featured-project').innerHTML =
        '<div class="featured"><div class="featured-inner">' +
          '<div class="featured-visual"><div class="phone">' +
            '<div class="phone-bar"></div><div class="phone-bar phone-bar2"></div>' +
            '<div class="phone-card" style="top:64px;"></div>' +
            '<div class="phone-card" style="top:128px;"></div>' +
            '<div class="phone-card" style="top:192px;"></div>' +
          '</div></div>' +
          '<div class="featured-content">' +
            (f.subtitle ? '<div class="sub">' + esc(f.subtitle) + '</div>' : '') +
            '<h3>' + esc(f.name) + '</h3>' +
            '<p>' + esc(f.description) + '</p>' +
            (features ? '<div class="feat-list">' + features + '</div>' : '') +
            (tech ? '<div class="badges">' + tech + '</div>' : '') +
            (f.downloads ? '<span class="downloads">' + esc(f.downloads) + '</span>' : '') +
            (ctas ? '<div class="feat-ctas">' + ctas + '</div>' : '') +
          '</div>' +
        '</div></div>';
    }

    var allProjects = projects.others || [];
    var showAllProjects = !!window.__showAllProjects;
    var visibleProjects = showAllProjects ? allProjects : allProjects.slice(0, 6);

    if($('other-projects-grid')){
      $('other-projects-grid').innerHTML = visibleProjects.map(function(p){
        var tags = (p.tags || []).map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('');
        var link = p.link ? '<div class="proj-links"><a href="' + esc(p.link) + '" target="_blank" rel="noopener">View Project</a></div>' : '';
        var thumb = p.image
          ? '<img src="' + esc(p.image) + '" alt="' + esc(p.name) + '" loading="lazy">'
          : svgIcon(p.icon, '');
        return '<div class="proj-card">' +
          '<div class="proj-thumb">' + thumb + '</div>' +
          '<div class="proj-body"><h4>' + esc(p.name) + '</h4><p>' + esc(p.description) + '</p>' +
          '<div class="proj-tags">' + tags + '</div>' + link + '</div></div>';
      }).join('');
    }

    var toggleWrap = document.querySelector('.proj-toggle');
    var total = allProjects.length;
    if(total > 6){
      if(!toggleWrap){
        toggleWrap = document.createElement('div');
        toggleWrap.className = 'proj-toggle';
        var toggleBtn = document.createElement('button');
        toggleBtn.type = 'button';
        toggleBtn.className = 'btn btn-outline';
        toggleBtn.id = 'other-projects-toggle';
        toggleBtn.setAttribute('aria-expanded', String(showAllProjects));
        toggleBtn.textContent = showAllProjects ? 'Show less' : 'See all';
        toggleBtn.addEventListener('click', function(){
          window.__showAllProjects = !window.__showAllProjects;
          renderProjects(projects);
        });
        toggleWrap.appendChild(toggleBtn);
        $('other-projects-grid').parentNode.appendChild(toggleWrap);
      }

      var toggleBtn = document.getElementById('other-projects-toggle');
      if(toggleBtn){
        toggleBtn.textContent = showAllProjects ? 'Show less' : 'See all';
        toggleBtn.setAttribute('aria-expanded', String(showAllProjects));
      }
    } else if(toggleWrap){
      toggleWrap.remove();
    }
  }

  function renderServices(services){
    setText('svc-label', services.label || 'What I Do');
    setText('svc-title', services.title);
    if($('services-grid')){
      $('services-grid').innerHTML = (services.items || []).map(function(s){
        return '<div class="svc-card">' + svgIcon(s.icon, 'svc-icon') +
          '<h4>' + esc(s.title) + '</h4><p>' + esc(s.description) + '</p></div>';
      }).join('');

  function renderApproach(approach){
    setText('ap-label', approach.label || 'Development Approach');
    setText('ap-title', approach.title);
    if($('approach-list')){
      $('approach-list').innerHTML = (approach.steps || []).map(function(step, i){
        return '<div class="ap-item"><span class="idx">' + pad(i + 1) + '</span><h4>' + esc(step) + '</h4></div>';
      }).join('');
    }

  /* Education — alternating cards along a centred progress rail */
  function renderEducation(edu){
    setText('edu-label', edu.label || 'Education');
    setText('edu-title', edu.title);
    var rail = $('edu-rail');
    if(!rail) return;

    var fill = $('edu-fill');
    var rows = (edu.items || []).map(function(item, i){
      var side = (i % 2 === 0) ? 'left' : 'right';
      return '<div class="edu-row ' + side + '">' +
        '<div class="edu-card">' +
          '<h4>' + esc(item.degree) + '</h4>' +
          '<div class="school">' + esc(item.institution) + '</div>' +
          (item.detail ? '<div class="detail">' + esc(item.detail) + '</div>' : '') +
          (item.status ? '<span class="when">' + esc(item.status) + '</span>' : '') +
        '</div>' +
        '<div class="edu-node">' + pad(i + 1) + '</div>' +
      '</div>';
    }).join('');

    rail.innerHTML = '<div class="edu-fill" id="edu-fill"></div>' + rows;
    fill = $('edu-fill');

    var nodes = Array.prototype.slice.call(rail.querySelectorAll('.edu-row'));
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function updateRail(){
      var railBox = rail.getBoundingClientRect();
      var marker = window.innerHeight * 0.62;
      var progress = (marker - railBox.top) / railBox.height;
      progress = Math.max(0, Math.min(1, progress));
      if(fill) fill.style.height = (reduced ? 100 : progress * 100) + '%';

      nodes.forEach(function(row){
        var box = row.getBoundingClientRect();
        var center = box.top + box.height / 2;
        row.classList.toggle('active', reduced || center <= marker);
      });
    }

    var ticking = false;
    function onScroll(){
      if(ticking) return;
      ticking = true;
      window.requestAnimationFrame(function(){ updateRail(); ticking = false; });
    }
    window.addEventListener('scroll', onScroll, {passive:true});
    window.addEventListener('resize', onScroll);
    updateRail();
  }

  function renderContact(contact, profile){
    setText('contact-label', contact.label || 'Contact');
    setText('contact-title', contact.sectionTitle);
    setText('contact-desc', contact.description);
    setText('p-location', profile.location);
    if(!profile.location && $('p-location-row')) $('p-location-row').style.display = 'none';

    if(profile.email){
      var row = $('p-email-row'), link = $('p-email-link');
      if(row && link){ link.href = 'mailto:' + profile.email; link.textContent = profile.email; row.style.display = 'flex'; }
    }
    if(profile.phone){
      var prow = $('p-phone-row'), plink = $('p-phone-link');
      if(prow && plink){ plink.href = 'tel:' + profile.phone.replace(/\s+/g,''); plink.textContent = profile.phone; prow.style.display = 'flex'; }
    }
    if(contact.buttonLabel && $('cf-submit')) $('cf-submit').textContent = contact.buttonLabel;
  }

  function renderGithubCta(cta, profile){
    setText('gh-title', cta.title);
    setText('gh-btn-label', cta.buttonLabel || profile.github);
    if($('gh-btn') && profile.github) $('gh-btn').href = profile.github;
  }

  function renderFooter(footer, profile){
    setText('footer-name', footer.name || profile.name);
    setText('footer-role', footer.role);
    setText('footer-copy', footer.copyright);
  }

  function renderSite(site, profile){
    if(site.brandName) setText('brand-name', site.brandName);
    if(site.brandSuffix) setText('brand-suffix', site.brandSuffix);
    if(site.pageTitle) document.title = site.pageTitle;
    if(site.metaDescription){
      var d = document.querySelector('meta[name="description"]');
      if(d) d.setAttribute('content', site.metaDescription);
    }
    if(site.metaKeywords){
      var k = document.querySelector('meta[name="keywords"]');
      if(k) k.setAttribute('content', site.metaKeywords);
    }
    if(profile.name){
      var a = document.querySelector('meta[name="author"]');
      if(a) a.setAttribute('content', profile.name);
    }
  }

  /* ============================================================
     3. Contact form — works with or without a form endpoint
     ============================================================ */
  function setupContactForm(contact, profile){
    var form = $('contactForm');
    if(!form) return;
    var statusBox = $('cf-status');
    var submitBtn = $('cf-submit');
    var endpoint = (contact && contact.formEndpoint) || '';
    var toEmail = profile.email || '';
    var defaultLabel = submitBtn ? submitBtn.textContent : 'Send Message';

    function status(kind, html){
      if(!statusBox) return;
      statusBox.className = 'form-status show ' + kind;
      statusBox.innerHTML = html;
    }
    function clearStatus(){
      if(statusBox){ statusBox.className = 'form-status'; statusBox.innerHTML = ''; }
    }

    ['cf-name','cf-email','cf-subject','cf-message'].forEach(function(id){
      var el = $(id);
      if(el) el.addEventListener('input', function(){ el.classList.remove('invalid'); });
    });

    function readFields(){
      return {
        name: ($('cf-name').value || '').trim(),
        email: ($('cf-email').value || '').trim(),
        subject: ($('cf-subject').value || '').trim(),
        message: ($('cf-message').value || '').trim()
      };
    }

    function validate(v){
      var bad = [];
      if(!v.name) bad.push('cf-name');
      if(!v.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) bad.push('cf-email');
      if(!v.subject) bad.push('cf-subject');
      if(!v.message) bad.push('cf-message');
      bad.forEach(function(id){ var el = $(id); if(el) el.classList.add('invalid'); });
      if(bad.length){
        var first = $(bad[0]);
        if(first) first.focus();
      }
      return bad.length === 0;
    }

    function openMailClient(v){
      if(!toEmail){
        status('err', 'No contact address is set yet. Add your address to <code>data.json</code> under <code>profile.email</code>.');
        return;
      }
      var body = 'Name: ' + v.name + '\nEmail: ' + v.email + '\n\n' + v.message;
      var href = 'mailto:' + toEmail +
                 '?subject=' + encodeURIComponent(v.subject) +
                 '&body=' + encodeURIComponent(body);

      // Opening via a real link click is far more reliable than assigning location.href,
      // which some browsers block when no mail handler is registered.
      var a = document.createElement('a');
      a.href = href;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ document.body.removeChild(a); }, 300);

      status('ok',
        'Your mail app should be opening with the message ready. ' +
        'If nothing happened, email me directly at <a href="mailto:' + esc(toEmail) + '">' + esc(toEmail) + '</a>.');
    }

    form.addEventListener('submit', function(e){
      e.preventDefault();
      clearStatus();
      var v = readFields();
      if(!validate(v)){
        status('err', 'Fill in every field with a valid email address, then send again.');
        return;
      }

      if(!endpoint){
        openMailClient(v);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';
      fetch(endpoint, {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: v.name,
          email: v.email,
          _replyto: v.email,
          subject: v.subject,
          message: v.message
        })
      })
      .then(function(res){
        if(!res.ok) throw new Error('bad response');
        form.reset();
        status('ok', 'Message sent. I usually reply within a day.');
      })
      .catch(function(){
        status('err', 'The message could not be sent. Opening your mail app instead…');
        setTimeout(function(){ openMailClient(v); }, 900);
      })
      .then(function(){
        submitBtn.disabled = false;
        submitBtn.textContent = defaultLabel;
      });
    });
  }

  /* ============================================================
     4. Chrome: theme toggle + mobile menu
     ============================================================ */
  function setupChrome(){
    var root = document.documentElement;
    var toggle = $('themeToggle');
    try {
      var saved = localStorage.getItem('sifat-portfolio-theme');
      if(saved) root.setAttribute('data-theme', saved);
    } catch(e){}
    if(toggle){
      toggle.addEventListener('click', function(){
        var current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        var next = current === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('sifat-portfolio-theme', next); } catch(e){}
      });
    }

    var btn = $('hamburger'), menu = $('mobileMenu');
    if(btn && menu){
      btn.addEventListener('click', function(){
        var open = menu.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(open));
      });
      menu.addEventListener('click', function(e){
        if(e.target.tagName === 'A'){
          menu.classList.remove('open');
          btn.setAttribute('aria-expanded', 'false');
        }
      });
    }
  }

  /* ============================================================
     5. Boot
     ============================================================ */
  function render(data){
    var profile = data.profile || {};
    renderSite(data.site || {}, profile);
    renderNav(data.nav);
    renderSocials(profile);
    if(data.hero) renderHero(data.hero, profile);
    if(data.about) renderAbout(data.about);
    if(data.skills) renderSkills(data.skills);
    if(data.experience) renderExperience(data.experience);
    if(data.projects) renderProjects(data.projects);
    if(data.services) renderServices(data.services);
    if(data.approach) renderApproach(data.approach);
    if(data.education) renderEducation(data.education);
    if(data.githubCta) renderGithubCta(data.githubCta, profile);
    renderContact(data.contact || {}, profile);
    renderFooter(data.footer || {}, profile);
    setupContactForm(data.contact || {}, profile);
  }

  setupChrome();

  fetch('data.json', {cache:'no-store'})
    .then(function(res){ if(!res.ok) throw new Error('data.json not reachable'); return res.json(); })
    .then(render)
    .catch(function(){
      // Opened straight from disk, or data.json is missing: render the small built-in copy
      try {
        render(JSON.parse($('fallback-data').textContent));
      } catch(e){}
      console.warn('data.json could not be loaded — showing fallback content. Serve the folder over http:// (or GitHub Pages) to see everything.');
    });
})();
</script>
